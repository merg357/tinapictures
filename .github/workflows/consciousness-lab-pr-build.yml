name: Consciousness Lab PR Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    defaults:
      run:
        working-directory: projects/quantum-consciousness-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reject Android system-TTS regression
        run: |
          set -euo pipefail
          if grep -R -n -E 'expo-speech|Speech\.(speak|stop|getAvailableVoicesAsync)' src package.json; then
            echo 'ERROR: system TTS returned to meditation runtime' >&2
            exit 1
          fi
          grep -q '"expo-audio"' package.json
      - name: Hydrate neural voice assets
        run: |
          set -euo pipefail
          python3 scripts/hydrate_voice_assets.py | tee /tmp/consciousness-lab-voice-assets.txt
          test "$(find assets/voices/v1/female -type f -name '*.mp3' | wc -l)" -eq 12
          test "$(find assets/voices/v1/male -type f -name '*.mp3' | wc -l)" -eq 12
          test -s assets/voices/v1/checksums.json
      - name: Core behavior tests
        run: npm test
      - name: Expo Doctor
        run: npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build universal standalone release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Verify standalone bundle and bundled neural audio
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" > /tmp/consciousness-lab-apk-contents.txt
          AUDIO_COUNT=$(awk '$4 ~ /\.mp3$/ {c++} END {print c+0}' /tmp/consciousness-lab-apk-contents.txt)
          echo "APK_MP3_COUNT=$AUDIO_COUNT"
          test "$AUDIO_COUNT" -ge 24
      - name: Verify APK is signed
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk"
      - name: Stage candidate APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ConsciousnessLab-v0.3.0-universal-standalone.apk
          test -s ConsciousnessLab-v0.3.0-universal-standalone.apk
          sha256sum ConsciousnessLab-v0.3.0-universal-standalone.apk | tee ConsciousnessLab-v0.3.0-universal-standalone.sha256
          ls -lh ConsciousnessLab-v0.3.0-universal-standalone.apk
      - name: Upload candidate APK before device smoke
        uses: actions/upload-artifact@v4
        with:
          name: ConsciousnessLab-v0.3.0-universal-candidate
          path: |
            projects/quantum-consciousness-lab/ConsciousnessLab-v0.3.0-universal-standalone.apk
            projects/quantum-consciousness-lab/ConsciousnessLab-v0.3.0-universal-standalone.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install, launch, navigate, and start natural narration on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          script: |
            set -eu
            APK=projects/quantum-consciousness-lab/ConsciousnessLab-v0.3.0-universal-standalone.apk
            tap_label() {
              XML="$1" LABEL="$2" python3 - <<'PY'
            import os,re
            s=open(os.environ['XML'], encoding='utf-8').read()
            label=re.escape(os.environ['LABEL'])
            m=re.search(r'<node[^>]*(?:text|content-desc)="'+label+r'"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',s)
            if not m:
                raise SystemExit('label not found: '+os.environ['LABEL'])
            a,b,c,d=map(int,m.groups()); print((a+c)//2,(b+d)//2)
            PY
            }
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.merg357.consciousnesslab
            adb shell monkey -p com.merg357.consciousnesslab -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell uiautomator dump /sdcard/onboarding.xml >/dev/null 2>&1
            adb pull /sdcard/onboarding.xml projects/quantum-consciousness-lab/android-onboarding.xml >/dev/null 2>&1
            grep -q 'Enter the Lab' projects/quantum-consciousness-lab/android-onboarding.xml
            set -- $(tap_label projects/quantum-consciousness-lab/android-onboarding.xml 'Enter the Lab'); adb shell input tap "$1" "$2"
            sleep 4
            adb shell uiautomator dump /sdcard/home.xml >/dev/null 2>&1
            adb pull /sdcard/home.xml projects/quantum-consciousness-lab/android-home.xml >/dev/null 2>&1
            grep -q 'How do you want to feel?' projects/quantum-consciousness-lab/android-home.xml
            for tab in Home Practice Explore Lab Journal; do grep -q "$tab" projects/quantum-consciousness-lab/android-home.xml; done
            set -- $(tap_label projects/quantum-consciousness-lab/android-home.xml 'Practice'); adb shell input tap "$1" "$2"
            sleep 3
            adb shell uiautomator dump /sdcard/practice.xml >/dev/null 2>&1
            adb pull /sdcard/practice.xml projects/quantum-consciousness-lab/android-practice.xml >/dev/null 2>&1
            grep -q 'Choose a path' projects/quantum-consciousness-lab/android-practice.xml
            grep -q 'Deep Rest' projects/quantum-consciousness-lab/android-practice.xml
            set -- $(tap_label projects/quantum-consciousness-lab/android-practice.xml 'Start Deep Rest'); adb shell input tap "$1" "$2"
            sleep 3
            adb shell uiautomator dump /sdcard/session-before.xml >/dev/null 2>&1
            adb pull /sdcard/session-before.xml projects/quantum-consciousness-lab/android-session-before.xml >/dev/null 2>&1
            grep -q 'Warm Female' projects/quantum-consciousness-lab/android-session-before.xml
            grep -q 'Deep Male' projects/quantum-consciousness-lab/android-session-before.xml
            grep -q 'Android system TTS is not used' projects/quantum-consciousness-lab/android-session-before.xml
            set -- $(tap_label projects/quantum-consciousness-lab/android-session-before.xml 'Narrator Deep Male'); adb shell input tap "$1" "$2"
            sleep 2
            adb shell uiautomator dump /sdcard/session-preview.xml >/dev/null 2>&1
            adb pull /sdcard/session-preview.xml projects/quantum-consciousness-lab/android-session-preview.xml >/dev/null 2>&1
            grep -q 'Natural narration' projects/quantum-consciousness-lab/android-session-preview.xml
            set -- $(tap_label projects/quantum-consciousness-lab/android-session-preview.xml 'Start Deep Rest'); adb shell input tap "$1" "$2"
            sleep 4
            adb shell uiautomator dump /sdcard/session-running.xml >/dev/null 2>&1
            adb pull /sdcard/session-running.xml projects/quantum-consciousness-lab/android-session-running.xml >/dev/null 2>&1
            grep -q 'Natural narration · playing' projects/quantum-consciousness-lab/android-session-running.xml
            grep -q 'Voice: Deep Male' projects/quantum-consciousness-lab/android-session-running.xml
            adb exec-out screencap -p > projects/quantum-consciousness-lab/android-smoke.png
            adb logcat -d > projects/quantum-consciousness-lab/android-logcat.txt
            ! grep -qi 'Unable to load script' projects/quantum-consciousness-lab/android-*.xml projects/quantum-consciousness-lab/android-logcat.txt
            ! grep -q 'FATAL EXCEPTION' projects/quantum-consciousness-lab/android-logcat.txt
            grep -Fq 'Running "main"' projects/quantum-consciousness-lab/android-logcat.txt
            adb shell pidof com.merg357.consciousnesslab
      - name: Upload launch and voice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ConsciousnessLab-v0.3.0-launch-evidence
          path: |
            projects/quantum-consciousness-lab/android-smoke.png
            projects/quantum-consciousness-lab/android-onboarding.xml
            projects/quantum-consciousness-lab/android-home.xml
            projects/quantum-consciousness-lab/android-practice.xml
            projects/quantum-consciousness-lab/android-session-before.xml
            projects/quantum-consciousness-lab/android-session-preview.xml
            projects/quantum-consciousness-lab/android-session-running.xml
            projects/quantum-consciousness-lab/android-logcat.txt
            /tmp/consciousness-lab-voice-assets.txt
            /tmp/consciousness-lab-apk-contents.txt
          if-no-files-found: warn
          retention-days: 30
