name: Consciousness Lab PR Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      NODE_ENV: production
    defaults:
      run:
        working-directory: projects/quantum-consciousness-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Core behavior tests
        run: npm test
      - name: Expo Doctor
        run: npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Show generated React host configuration
        run: |
          find android/app/src/main/java -name 'MainApplication.kt' -print -exec sed -n '1,220p' {} \;
      - name: Build universal standalone release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Verify standalone JavaScript bundle is packaged
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
      - name: Verify APK is signed
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk"
      - name: Stage candidate APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ConsciousnessLab-v0.1.2-universal-standalone.apk
          test -s ConsciousnessLab-v0.1.2-universal-standalone.apk
          sha256sum ConsciousnessLab-v0.1.2-universal-standalone.apk | tee ConsciousnessLab-v0.1.2-universal-standalone.sha256
          ls -lh ConsciousnessLab-v0.1.2-universal-standalone.apk
      - name: Upload candidate APK before device smoke
        uses: actions/upload-artifact@v4
        with:
          name: ConsciousnessLab-v0.1.2-universal-candidate
          path: |
            projects/quantum-consciousness-lab/ConsciousnessLab-v0.1.2-universal-standalone.apk
            projects/quantum-consciousness-lab/ConsciousnessLab-v0.1.2-universal-standalone.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install and launch exact APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          script: |
            adb install -r projects/quantum-consciousness-lab/ConsciousnessLab-v0.1.2-universal-standalone.apk
            adb logcat -c
            adb shell am force-stop com.merg357.consciousnesslab
            adb shell monkey -p com.merg357.consciousnesslab -c android.intent.category.LAUNCHER 1
            sleep 12
            adb exec-out screencap -p > projects/quantum-consciousness-lab/android-smoke.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml projects/quantum-consciousness-lab/android-window.xml >/dev/null 2>&1 || true
            adb logcat -d > projects/quantum-consciousness-lab/android-logcat.txt
            echo '=== visible UI ==='
            cat projects/quantum-consciousness-lab/android-window.xml || true
            echo '=== relevant logcat ==='
            grep -Ei 'Unable to load script|FATAL EXCEPTION|ReactNativeJS|ReactHost|JSBundle|Hermes' projects/quantum-consciousness-lab/android-logcat.txt | tail -250 || true
            test -s projects/quantum-consciousness-lab/android-window.xml
            test -s projects/quantum-consciousness-lab/android-logcat.txt
            ! grep -qi 'Unable to load script' projects/quantum-consciousness-lab/android-window.xml projects/quantum-consciousness-lab/android-logcat.txt
            ! grep -q 'FATAL EXCEPTION' projects/quantum-consciousness-lab/android-logcat.txt
            grep -q 'CONSCIOUSNESS LAB' projects/quantum-consciousness-lab/android-window.xml
            grep -Fq 'Running "main"' projects/quantum-consciousness-lab/android-logcat.txt
            adb shell pidof com.merg357.consciousnesslab
      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ConsciousnessLab-v0.1.2-launch-evidence
          path: |
            projects/quantum-consciousness-lab/android-smoke.png
            projects/quantum-consciousness-lab/android-window.xml
            projects/quantum-consciousness-lab/android-logcat.txt
          if-no-files-found: warn
          retention-days: 30
