name: Consciousness Lab PR Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
    defaults:
      run:
        working-directory: projects/quantum-consciousness-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Core behavior tests
        run: npm test
      - name: Expo Doctor
        run: npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build ARM64 standalone release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Verify standalone JavaScript bundle is packaged
        run: unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
      - name: Verify APK is signed
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk"
      - name: Stage and verify APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ConsciousnessLab-v0.1.1-arm64-standalone.apk
          test -s ConsciousnessLab-v0.1.1-arm64-standalone.apk
          sha256sum ConsciousnessLab-v0.1.1-arm64-standalone.apk | tee ConsciousnessLab-v0.1.1-arm64-standalone.sha256
          ls -lh ConsciousnessLab-v0.1.1-arm64-standalone.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConsciousnessLab-v0.1.1-arm64-standalone
          path: |
            projects/quantum-consciousness-lab/ConsciousnessLab-v0.1.1-arm64-standalone.apk
            projects/quantum-consciousness-lab/ConsciousnessLab-v0.1.1-arm64-standalone.sha256
          if-no-files-found: error
          retention-days: 30
