name: Consciousness Lab Android Build

on:
  push:
    branches:
      - build/consciousness-lab-v0-1

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
    defaults:
      run:
        working-directory: projects/quantum-consciousness-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Core behavior tests
        run: npm test

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Stage and verify APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ConsciousnessLab-v0.1.0-debug.apk
          test -s ConsciousnessLab-v0.1.0-debug.apk
          sha256sum ConsciousnessLab-v0.1.0-debug.apk | tee ConsciousnessLab-v0.1.0-debug.sha256
          ls -lh ConsciousnessLab-v0.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConsciousnessLab-v0.1.0-debug
          path: |
            projects/quantum-consciousness-lab/ConsciousnessLab-v0.1.0-debug.apk
            projects/quantum-consciousness-lab/ConsciousnessLab-v0.1.0-debug.sha256
          if-no-files-found: error
          retention-days: 30
